spring.application.name=cloud-media-uploader

# Database Configuration (DigitalOcean Managed Database)
spring.datasource.url=${production-database.DATABASE_URL:${DATABASE_URL:jdbc:postgresql://db-postgresql-fra1-18257-do-user-23913793-0.d.db.ondigitalocean.com:25060/defaultdb?sslmode=require}}
spring.datasource.username=${production-database.USERNAME:${DATABASE_USERNAME:doadmin}}
spring.datasource.password=${production-database.PASSWORD:${DATABASE_PASSWORD:AVNS_tv8xNfDlcD9jtjppHO1}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (Prevent connection exhaustion)
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.initialization-fail-timeout=10000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Settings
# File Upload Settings
