spring.application.name=cloud-media-uploader

# Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# DigitalOcean Spaces Configuration
# Environment variable with fallback to real credentials
digitalocean.spaces.access-key=${DO_SPACES_ACCESS_KEY:DO801RX6BENQ9P774P82}
digitalocean.spaces.secret-key=${DO_SPACES_SECRET_KEY:TCyAh5bq9wi4Wv1KnyltIV+Td+KSbEuOk9jSJ3TAGw4}
digitalocean.spaces.region=${DO_SPACES_REGION:fra1}
digitalocean.spaces.bucket=${DO_SPACES_BUCKET:profile-pics-2026}
digitalocean.spaces.endpoint=${DO_SPACES_ENDPOINT:https://fra1.digitaloceanspaces.com}

# Allowed file types
upload.allowed-types=image/jpeg,image/png,image/jpg,image/webp
